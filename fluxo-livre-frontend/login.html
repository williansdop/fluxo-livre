<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - Fluxo Livre</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">

    <main class="auth-container">
        <img src="assets/logo.png" alt="Fluxo Livre" class="auth-logo">
        
        <form id="form-login" class="auth-form">
            <h2>Entrar na conta</h2>

            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" required placeholder="seu@email.com">
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <div class="password-wrapper">
                    <input type="password" id="password" required placeholder="••••••••">
                    <button type="button" class="btn-toggle-password" aria-label="Mostrar senha" title="Mostrar/ocultar senha">
                        <svg class="icon-eye" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <svg class="icon-eye-off hidden" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-primary btn-block">Entrar</button>

            <div class="auth-links">
                <p class="register-text">
                    Ainda não tem conta? <a href="register.html" class="link-highlight">Cadastre-se</a>
                </p>
                <a href="index.html" class="btn-link">Voltar ao início</a>
            </div>
        </form>
    </main>

    <script src="app.js"></script>
</body>
</html>
