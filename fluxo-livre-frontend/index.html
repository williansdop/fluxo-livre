<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fluxo Livre</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="home-body">

    <main class="home-container">
        <div class="logo-wrapper">
            <a href="index.html" class="logo-link" title="Fluxo Livre - Início">
                <img src="assets/logo.png" alt="Fluxo Livre" class="main-logo">
            </a>
        </div>

        <nav class="menu-grid">
            <a href="map.html" class="menu-item">
                <div class="icon-circle">
                    <i data-lucide="map"></i>
                </div>
                <span>Mapa</span>
            </a>

            <a href="login.html" class="menu-item">
                <div class="icon-circle">
                    <i data-lucide="user"></i>
                </div>
                <span>Login / Registro</span>
            </a>

            <a href="#info" class="menu-item">
                <div class="icon-circle">
                    <i data-lucide="info"></i>
                </div>
                <span>Informações</span>
            </a>

            <a href="#acessibilidade" class="menu-item">
                <div class="icon-circle">
                    <i data-lucide="accessibility"></i>
                </div>
                <span>Acessibilidade</span>
            </a>
        </nav>
    </main>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
